name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"
          cache: "pip"
          cache-dependency-path: requirements-release.lock

      - name: Verify tag and version consistency
        id: version
        shell: pwsh
        run: |
          $version = python scripts/verify_release_version.py --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tagged commit belongs to main
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from origin/main."
          }

      - name: Install build and test dependencies
        run: python -m pip install --require-hashes -r requirements-release.lock

      - name: Compile source
        run: python -m py_compile translator_core.py gui_app.py app_storage.py app_version.py

      - name: Run complete offline test suite
        run: python -m pytest -q

      - name: Run public sample round-trip smoke test
        run: python scripts/offline_release_smoke.py

      - name: Reject committed credentials
        run: python scripts/check_secrets.py

      - name: Build from the committed PyInstaller spec
        run: python -m PyInstaller --clean --noconfirm CSVTranslator.spec

      - name: Check frozen executable startup
        shell: pwsh
        run: |
          $executable = "dist/CSVTranslator-${{ steps.version.outputs.version }}.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--check-runtime" `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen executable runtime check failed with exit code $($process.ExitCode)."
          }

      - name: Upload unsigned build for the isolated release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-executable
          path: dist/CSVTranslator-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 1

  prepare_release:
    needs: build
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the isolated build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-windows-executable
          path: release-assets

      - name: Name the versioned release asset
        id: asset
        shell: pwsh
        run: |
          $assetName = "CSVTranslator-v${{ needs.build.outputs.version }}-windows-x64.exe"
          Move-Item -LiteralPath "release-assets/CSVTranslator-${{ needs.build.outputs.version }}.exe" `
            -Destination "release-assets/$assetName"
          "name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Sign executable when signing secrets are configured
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $asset = "release-assets/${{ steps.asset.outputs.name }}"
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Both Authenticode signing secrets must be configured together."
          }
          if (-not $hasCertificate) {
            "::notice::Authenticode signing skipped: optional signing secrets are not configured."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found on the runner." }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD $asset
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa /v $asset
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $assetName = "${{ steps.asset.outputs.name }}"
          $hash = (Get-FileHash "release-assets/$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$assetName" | Set-Content "release-assets/$assetName.sha256" -Encoding ascii

      - name: Check final executable startup
        shell: pwsh
        run: |
          $executable = "release-assets/${{ steps.asset.outputs.name }}"
          $process = Start-Process -FilePath $executable -ArgumentList "--check-runtime" `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Final executable runtime check failed with exit code $($process.ExitCode)."
          }

      - name: Create or resume draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assetName = "${{ steps.asset.outputs.name }}"
          $existing = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            if (-not $release.isDraft) {
              if ($assetNames -contains $assetName -and
                  $assetNames -contains "$assetName.sha256") {
                "::notice::Release already exists with both expected assets."
                exit 0
              }
              throw "A published but incomplete release already exists for $tag."
            }
          }
          else {
            gh release create $tag --verify-tag --draft `
              --title "CSV Translator $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag `
            "release-assets/$assetName" `
            "release-assets/$assetName.sha256" `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $uploaded = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($uploaded -notcontains $assetName -or
              $uploaded -notcontains "$assetName.sha256") {
            throw "Draft release does not contain both expected assets."
          }

          "::notice::Draft release is complete and ready for the protected publish job."

  publish:
    needs: [build, prepare_release]
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify and publish completed draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assetName = "CSVTranslator-v${{ needs.build.outputs.version }}-windows-x64.exe"
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains $assetName -or
              $assetNames -notcontains "$assetName.sha256") {
            throw "Release cannot be published without both expected assets."
          }
          if (-not $release.isDraft) {
            "::notice::Release is already published with both expected assets."
            exit 0
          }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
